    /* Radar scan animation for hyperlocal discovery */
    @keyframes radar-scan {
      0% { transform: scale(0.3); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }

    }
    .laser-line {

    // Sound chime helper using Web Audio API
    function playOrderChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12); // A5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.warn("Audio not permitted yet:", e);
      }
    }

    function getProductFallback(product) {
      const text = `${product?.title || ''} ${product?.category || ''}`.toLowerCase();
      if (/rajma|bean|dal|lentil|pulse/.test(text)) return '🫘';
      if (/rice|atta|flour|oat|grain|rava/.test(text)) return '🌾';
      if (/salt|sugar|spice/.test(text)) return '🧂';
      if (/apple|banana|fruit|carrot|vegetable|plant/.test(text)) return '🥕';
      if (/milk|butter|cheese|dairy/.test(text)) return '🥛';
      if (/tea|coffee|beverage/.test(text)) return '☕';
      if (/cake|cookie|croissant|muffin|bread|loaf|sandwich|bakery|brownie|donut|puff|tart/.test(text)) return '🥐';
      if (/headphone|earbud|speaker|audio/.test(text)) return '🎧';
      if (/charger|cable|power bank|keyboard|mouse|camera|phone|laptop|watch|electronic|sleeve/.test(text)) return '🔌';
      if (/vase|pottery|ceramic|basket|candle|handmade|macrame|keychain|frame|gift|craft/.test(text)) return '🪴';
      if (/lamp|cushion|towel|pan|rug|clock|bottle|jar|plate|home|kitchen/.test(text)) return '🏡';
      return '🛍️';
    }

    // Show REAL product photographs from the catalogue URLs. Seller-uploaded photos
    // (data URLs) are also shown as-is. A category icon is used only if a photo fails.
    function getProductVisual(product) {
      if (product?.image && (product.image.startsWith('data:image/') || /^https?:\/\//i.test(product.image))) {
        return product.image;
      }
      const emoji = getProductFallback(product);
      const title = String(product?.title || 'Local product').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#ecfdf5"/></linearGradient></defs><rect width="600" height="400" rx="28" fill="url(#bg)"/><circle cx="300" cy="145" r="88" fill="#ffffff" fill-opacity=".8"/><text x="300" y="176" text-anchor="middle" font-size="104">${emoji}</text><text x="300" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#334155">${title.slice(0,42)}</text><text x="300" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#64748b">Photo unavailable</text></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

      const showToast = (msg) => {
        setToastMessage(msg);

      };

      const startLiveLocation = () => {
        if (!navigator.geolocation) {
          setLocationError('This browser does not support location sharing.');
          return;
        }
        if (locationWatchRef.current !== null) navigator.geolocation.clearWatch(locationWatchRef.current);
        setLocationError('');
        setLocationTracking(true);
        const watchId = navigator.geolocation.watchPosition(
          (position) => {
            setLiveLocation({ latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: Math.round(position.coords.accuracy), updatedAt: new Date().toLocaleTimeString() });
            setLocationError('');
          },
          (error) => {
            setLocationTracking(false);
            const message = error.code === 1 ? 'Location permission was denied. Allow location access in your browser to use this feature.' : error.code === 2 ? 'Your current location is unavailable. Try again outdoors or check device location settings.' : 'Location request timed out. Please try again.';
            setLocationError(message);
            if (locationWatchRef.current !== null) navigator.geolocation.clearWatch(locationWatchRef.current);
            locationWatchRef.current = null;
          },
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
        );
        locationWatchRef.current = watchId;
        showToast('Location sharing started. Your browser will keep updating while this page stays open.');
      };

      const stopLiveLocation = () => {
        if (locationWatchRef.current !== null && navigator.geolocation) navigator.geolocation.clearWatch(locationWatchRef.current);

        setLocationTracking(false);
        showToast('Location tracking stopped.');

      // Voice recognition setup
      const handleVoiceSearch = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          // Fallback simulation for live demo
          const samplePhrases = ["Tata Tea", "Atta", "Amul Butter", "Milk"];
          const picked = samplePhrases[Math.floor(Math.random() * samplePhrases.length)];
          setSearchQuery(picked);
          showToast(`🎤 Voice recognized: "${picked}"`);
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = language === 'hi' ? 'hi-IN' : language === 'kn' ? 'kn-IN' : 'en-IN';
          recognition.interimResults = false;
          setIsListening(true);

          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setSearchQuery(transcript);
            setIsListening(false);
            showToast(`🎤 Heard: "${transcript}"`);
          };

          recognition.onerror = () => {
            setIsListening(false);
            // Graceful demo fallback
            setSearchQuery("Amul Butter");
            showToast("🎤 Fallback demo speech: 'Amul Butter'");
          };

          recognition.onend = () => setIsListening(false);
          recognition.start();
        } catch (err) {
          setIsListening(false);
          setSearchQuery("Aashirvaad Atta");
          showToast("🎤 Voice Search triggered: 'Aashirvaad Atta'");

          return;
        }
        if (!product || product.stock <= 0) {
          showToast('Sorry, this product is out of stock.');
          return;
        }
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) {
            if (existing.qty >= product.stock) {
              showToast(`Only ${product.stock} available for ${product.title}.`);
              return prev;
            }
            return prev.map(item => item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }

        if (file.size > 8 * 1024 * 1024) { showToast('Please choose an image smaller than 8 MB.'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const source = new Image();
          source.onload = () => {
            const canvas = document.createElement('canvas');
            const maxSide = 700;
            const scale = Math.min(1, maxSide / Math.max(source.width, source.height));
            canvas.width = Math.max(1, Math.round(source.width * scale));
            canvas.height = Math.max(1, Math.round(source.height * scale));
            const ctx = canvas.getContext('2d');
            ctx.drawImage(source, 0, 0, canvas.width, canvas.height);

          source.onerror = () => showToast('Could not read that image. Please try another file.');

                </div>

                {cart.length > 0 && (
                  <div className="pt-4 border-t border-slate-200">
                    <div className="flex justify-between text-sm font-extrabold text-slate-900 mb-4">
                      <span>Total to Pay:</span>
                      <span className="text-orange-600 text-lg">₹{cartTotal}</span>
                    </div>

                    <button 
                      onClick={() => setIsCheckoutModalOpen(true)}
                      className="w-full bg-orange-600 hover:bg-orange-700 text-white font-extrabold text-sm py-3 rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                      <span>⚡</span>
                      <span>{t.checkout}</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* --- MOCK UPI CHECKOUT MODAL --- */}
          {isCheckoutModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative border border-slate-200">
                <button 
                  onClick={() => setIsCheckoutModalOpen(false)} 
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg font-bold">
                  ✕
                </button>

                <div className="text-center mb-4">
                  <div className="inline-block p-2 bg-orange-50 text-orange-600 rounded-2xl mb-1">
                    <span className="text-2xl">📱</span>
                  </div>
                  <h3 className="font-extrabold text-lg text-slate-900">Instant UPI Payment</h3>
                  <p className="text-xs text-slate-500">Demo checkout only. No real QR payment is processed. Confirming below creates a demo order and opens WhatsApp.</p>
                </div>

                {/* Delivery Option Toggle */}
                <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl mb-4 text-xs font-bold">
                  <button 
                    onClick={() => setDeliveryOption('pickup')}
                    className={`py-2 rounded-lg transition ${deliveryOption === 'pickup' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-600'}`}>
                    🏃 15-Min Pickup
                  </button>
                  <button 
                    onClick={() => setDeliveryOption('delivery')}
                    className={`py-2 rounded-lg transition ${deliveryOption === 'delivery' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-600'}`}>
                    🛵 Local Delivery
                  </button>
                </div>

                {deliveryOption === 'delivery' && (
                  <div className="rounded-2xl border border-sky-200 bg-sky-50 p-4 mb-4">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <h4 className="font-extrabold text-sm text-sky-900">📍 Delivery Location</h4>
                        <p className="text-xs text-sky-800 mt-1">Allow location access to attach your latest map location to the seller's WhatsApp order message.</p>
                      </div>
                      {!locationTracking ? (
                        <button type="button" onClick={startLiveLocation} className="shrink-0 rounded-xl bg-sky-700 hover:bg-sky-800 text-white px-3 py-2 text-xs font-bold">Share location</button>
                      ) : (
                        <button type="button" onClick={stopLiveLocation} className="shrink-0 rounded-xl bg-white border border-sky-300 text-sky-800 px-3 py-2 text-xs font-bold">Stop</button>
                      )}
                    </div>
                    {liveLocation && <div className="mt-3 text-xs text-sky-900"><p className="font-bold">{locationTracking ? 'Location updating' : 'Last location saved'} · accuracy about {liveLocation.accuracy} m</p><p>Last update: {liveLocation.updatedAt}</p><a className="inline-block mt-1 underline font-bold" href={`https://www.google.com/maps?q=${liveLocation.latitude},${liveLocation.longitude}`} target="_blank" rel="noreferrer">Preview location in Google Maps</a></div>}
                    {locationError && <p role="alert" className="text-xs text-rose-700 mt-2">{locationError}</p>}
                    <p className="text-[10px] text-sky-700 mt-2">Demo limitation: live coordinates update in this browser; only the latest location is attached to WhatsApp. Continuous tracking visible to the seller requires a backend/realtime service.</p>
                  </div>
                )}

                {/* Simulated UPI QR Code */}
                <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-4 flex flex-col items-center justify-center mb-4">
                  <div className="w-36 h-36 bg-white p-2 rounded-xl shadow-inner flex items-center justify-center border" aria-label="Decorative demo QR illustration">
                    {/* Decorative illustration only; not a scannable payment QR code */}
                    <svg className="w-full h-full text-slate-900" viewBox="0 0 100 100" fill="currentColor">
                      <path d="M10 10h30v30H10zm6 6v18h18V16zm44-6h30v30H60zm6 6v18h18V16zM10 60h30v30H10zm6 6v18h18V66zm50-6h10v10H66zm14 0h10v10H80zm-14 14h10v16H66zm14 10h10v6H80zm-4-4h4v4h-4zm0-16h4v4h-4zm-20 4h10v10H56zm-10 0h6v6h-6zm0 10h6v6h-6zm10 0h6v6h-6z" />
                    </svg>
                  </div>
                  <div className="font-extrabold text-base text-slate-900 mt-3">₹{cartTotal}</div>
                  <div className="text-[11px] text-slate-400">DEMO ONLY — no real payment is processed</div>
                </div>

                {/* 1-Click Payment Confirmation */}
                <button 
                  onClick={handleExecuteUpiOrder}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm py-3 rounded-2xl transition shadow-lg flex items-center justify-center gap-2">
                  <span>✓</span>
                  <span>Confirm Demo Payment & Place Order (₹{cartTotal})</span>
                </button>
              </div>
            </div>
          )}

          {/* --- FLOATING TOAST NOTIFICATION --- */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 border border-slate-800 animate-bounce">
              <span>🔔</span>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<BazaarApp />);
  </script>
</body>
</html>
